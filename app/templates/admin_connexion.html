{% extends "base.html" %}
{% block titre %}Connexion administrateur{% endblock %}
{% block contenu %}
<section>
    <h2>Connexion administrateur</h2>
    <p>Espace réservé : métadonnées du modèle et comparaison complète des modèles testés,
       non exposées sur les pages publiques.</p>

    <form method="post" action="{{ url_for('admin_connexion', suivant=request.args.get('suivant')) }}">
        <div class="champ">
            <label for="utilisateur">Identifiant</label>
            <input type="text" id="utilisateur" name="utilisateur" autocomplete="username" required>
        </div>
        <div class="champ">
            <label for="mot_de_passe">Mot de passe</label>
            <input type="password" id="mot_de_passe" name="mot_de_passe" autocomplete="current-password" required>
        </div>
        <button type="submit">Se connecter</button>
    </form>
</section>
{% endblock %}
